<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamTree</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            margin: 0;
            padding: 0;
            height: 100dvh;
            overflow: hidden;
        }
        header {
            background: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .logo { font-size: 28px; font-weight: 800; color: #4f46e5; }

        .tree-container {
            height: calc(100dvh - 70px);
            overflow: auto;
            padding: 30px;
            background: #f8fafc;
            position: relative;
        }

        .generation {
            margin-bottom: 80px;
            text-align: center;
        }

        .gen-title {
            font-size: 18px;
            color: #64748b;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .people-row {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .person {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            width: 180px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border: 4px solid;
            position: relative;
        }

        .person.male { border-color: #3b82f6; }
        .person.female { border-color: #ec4899; }
        .person.other { border-color: #10b981; }

        .person h3 { margin: 8px 0 4px; font-size: 17px; }
        .person small { color: #64748b; }

        .connector {
            height: 60px;
            width: 3px;
            background: #64748b;
            margin: 0 auto;
        }

        .spouse-line {
            height: 3px;
            background: #64748b;
            margin: 15px auto;
            width: 80px;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 12px;
            border-radius: 9999px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            gap: 10px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo"><i class="fas fa-tree"></i> FamTree</div>
        <button onclick="showLogin()">Sign In</button>
    </header>

    <div class="tree-container" id="treeContainer">
        <!-- Tree will be generated here -->
    </div>

    <div class="controls">
        <button onclick="addPersonPrompt()" title="Add Person"><i class="fas fa-plus"></i></button>
        <button onclick="loadExample()" title="Example"><i class="fas fa-magic"></i></button>
        <button onclick="exportToPDF()" style="background:#10b981;" title="Export PDF"><i class="fas fa-file-pdf"></i></button>
    </div>

    <script>
        let people = [];
        let relationships = [];

        function renderTree() {
            const container = document.getElementById('treeContainer');
            container.innerHTML = '<h2 style="text-align:center; color:#1e2937; margin:20px;">Your Family Tree</h2>';

            // Simple layered rendering (Generation 1, 2, 3...)
            const gen1 = people.slice(0, 2); // Top generation example
            const gen2 = people.slice(2, 4);
            const gen3 = people.slice(4);

            // Generation 1
            if (gen1.length > 0) {
                const div = createGeneration("Generation 1 (Grandparents)", gen1);
                container.appendChild(div);
            }

            // Connector
            container.innerHTML += '<div class="connector" style="height:80px"></div>';

            // Generation 2
            if (gen2.length > 0) {
                const div = createGeneration("Generation 2 (Parents)", gen2);
                container.appendChild(div);
            }

            // Generation 3
            if (gen3.length > 0) {
                container.innerHTML += '<div class="connector" style="height:80px"></div>';
                const div = createGeneration("Generation 3 (Children)", gen3);
                container.appendChild(div);
            }
        }

        function createGeneration(title, members) {
            const gen = document.createElement('div');
            gen.className = 'generation';
            gen.innerHTML = `<div class="gen-title">${title}</div>`;
            
            const row = document.createElement('div');
            row.className = 'people-row';

            members.forEach(person => {
                const card = document.createElement('div');
                card.className = `person ${person.gender}`;
                card.innerHTML = `
                    <h3>${person.name}</h3>
                    <small>${person.gender} • ${person.birthdate || '—'}</small>
                `;
                row.appendChild(card);
            });

            gen.appendChild(row);
            return gen;
        }

        function addPersonPrompt() {
            const name = prompt("Person's Full Name:");
            if (!name) return;
            const gender = prompt("Gender (male / female / other):", "male").toLowerCase();
            const birth = prompt("Birth Year (optional):");
            people.push({id: Date.now(), name, gender, birthdate: birth});
            renderTree();
        }

        function loadExample() {
            people = [
                {id:1, name:"Henry Thompson", gender:"male", birthdate:"1952"},
                {id:2, name:"Margaret Thompson", gender:"female", birthdate:"1955"},
                {id:3, name:"James Thompson", gender:"male", birthdate:"1979"},
                {id:4, name:"Sophia Thompson", gender:"female", birthdate:"1982"},
                {id:5, name:"Emma Thompson", gender:"female", birthdate:"2006"},
                {id:6, name:"Liam Thompson", gender:"male", birthdate:"2009"}
            ];
            renderTree();
        }

        async function exportToPDF() {
            alert("In a full version this would export the tree as PDF.\n\nFor now, use browser print (Ctrl+P) → Save as PDF.");
        }

        function showLogin() {
            const name = prompt("Enter your name to sign in:");
            if (name) alert(`Signed in as ${name}. Progress is saved in browser.`);
        }

        // Initialize
        window.onload = () => {
            loadExample();
        };
    </script>
</body>
</html>
